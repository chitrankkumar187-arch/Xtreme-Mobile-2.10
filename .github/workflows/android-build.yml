name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" \
                     "build-tools;34.0.0" \
                     "ndk;26.2.11394342" \
                     "cmake;3.22.1"

      - name: Create signing key
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../keys"
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/../keys/new.jks" \
            -storepass 123123 \
            -keypass 123123 \
            -alias key0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Xtreme City, OU=Mobile, O=Xtreme City, L=India, ST=UP, C=IN"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xtreme-Mobile-2.10-debug
          path: app/build/outputs/apk/debug/*.apk
